# Indoor 4x5 plant test bed (Sec. IV, Experimental Setup).
#
# Reproduces the settings reported for the indoor evaluation: a 25x25 m
# map centred on the robot, a circular projection mask at retention
# factor alpha=0.4, and the 40-60 cm semantic height band used for the
# reported crop-geometry experiments.
#
# Usage:
#   sana-map --config configs/indoor.yaml --dump_dir results/indoor_run_01

parameters:
  classes:
    - potted plant

  yolo_or_owl: 2          # YOLOE
  conf: 0.1
  iou: 0.5
  use_reduced_masks: 1
  mask_reduction_factor: 0.4
  mask_shape: circular

  frame_width: 1280
  frame_height: 720
  env_frame_width: 1280
  env_frame_height: 720
  hfov: 100.39
  camera_height: 0.38
  min_depth: 0.5
  max_depth: 5.0

  map_size_cm: 2500       # 25 x 25 m
  map_resolution: 5
  global_downscaling: 1
  vision_range: 100
  farm_or_indoors: 0      # map origin at the map centre
  update_frequency: 25

  min_z: 40.0
  max_z: 60.0
  max_height: 250.0
  cat_pred_threshold: 5.0
  map_pred_threshold: 1.0
  exp_pred_threshold: 1.0
